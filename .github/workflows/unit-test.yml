name: 🧪 Unit Tests

on:
  workflow_call: {}
  push: {}

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Rust
        run: |
          rustup toolchain install stable
          rustup default stable
          rustup component add llvm-tools-preview

      - name: Install code coverage tool
        uses: taiki-e/install-action@11f460a4042c6aedd95853e41f4eb4f10459fc5d # cargo-llvm-cov

      - name: Run tests
        run: cargo llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov report --lcov --output-path target/lcov.info

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          fail_ci_if_error: true
          files: ./target/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
      
      - name: Upload coverage to Aikido
        uses: AikidoSec/code-coverage-github-action@18138c9866f45cb159779a167d6e1330c967fe28 #v0.1.1
        with:
          lcov-file-paths: target/lcov.info

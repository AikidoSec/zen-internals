[package]
name = "zen-proxy"
version = "0.0.0"
edition = "2024"
authors = ["Aikido Security"]
description = "Local intercepting proxy used by Zen by Aikido"
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "zen-proxy"
path = "src/main.rs"

[dependencies]
rama = { version = "0.4.0", default-features = false, features = ["boring", "http-backend", "tcp", "dns"] }
rama-http-backend = { version = "0.4.0", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
brotli = "8"
aws-smithy-eventstream = "0.61"
base64 = "0.22"
percent-encoding = "2"

[dev-dependencies]
aws-smithy-types = "1.8"
base64 = "0.22"
tokio = { version = "1", features = ["io-util", "net", "process", "time"] }
